name: NEXO - Testes automatizados

on:
  push:
    branches:
      - develop/comercial
      - 'feature/**'
  pull_request:
    branches:
      - develop/comercial
      - main

permissions:
  contents: read

jobs:
  tests:
    name: unittest (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter o código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Preparar Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Verificar descoberta de testes
        run: |
          python - <<'PY'
          import unittest

          suite = unittest.TestLoader().discover('tests', pattern='test_*.py')
          count = suite.countTestCases()
          if count == 0:
              raise SystemExit('Nenhum teste descoberto; execução reprovada.')
          print(f'Testes descobertos: {count}')
          PY

      - name: Executar a suíte sequencialmente
        run: python -m unittest discover -s tests -p "test_*.py" -v
