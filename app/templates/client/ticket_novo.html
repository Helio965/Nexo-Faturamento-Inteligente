{% extends 'base.html' %}
{% block title %}Novo Ticket — NEXO{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-2 mb-4">
  <a href="{{ url_for('client.tickets') }}" class="btn btn-sm btn-outline-secondary">
    <i class="bi bi-arrow-left"></i>
  </a>
  <h4 class="fw-bold mb-0">Abrir Novo Ticket</h4>
</div>

<div class="card" style="max-width: 600px;">
  <div class="card-body">
    <div class="alert alert-info small mb-3">
      <i class="bi bi-info-circle"></i>
      A prioridade do seu ticket é definida automaticamente pelo plano
      <strong>{{ empresa.plano_atual.nome_plano }}</strong>:
      <strong>{{ empresa.plano_atual.prioridade_ticket }}</strong>.
    </div>
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Assunto <span class="text-danger">*</span></label>
        <input type="text" class="form-control" name="assunto" required
               placeholder="Descreva brevemente o problema ou dúvida"
               maxlength="300">
      </div>
      <div class="mb-4">
        <label class="form-label">Mensagem <span class="text-danger">*</span></label>
        <textarea class="form-control" name="conteudo" rows="5" required
                  placeholder="Descreva em detalhes…"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-send"></i> Abrir Ticket
      </button>
    </form>
  </div>
</div>
{% endblock %}
