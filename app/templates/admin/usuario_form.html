{% extends 'base.html' %}
{% block title %}Novo Usuário — {{ empresa.nome_fantasia }}{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-2 mb-4">
  <a href="{{ url_for('admin.empresa_detalhe', id=empresa.id_empresa) }}" class="btn btn-sm btn-outline-secondary">
    <i class="bi bi-arrow-left"></i>
  </a>
  <h4 class="fw-bold mb-0">Novo Usuário — {{ empresa.nome_fantasia }}</h4>
</div>

<div class="card" style="max-width: 480px;">
  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Nome <span class="text-danger">*</span></label>
        <input type="text" class="form-control" name="nome" required>
      </div>
      <div class="mb-3">
        <label class="form-label">E-mail <span class="text-danger">*</span></label>
        <input type="email" class="form-control" name="email" required>
      </div>
      <div class="mb-4">
        <label class="form-label">Senha <span class="text-danger">*</span></label>
        <input type="password" class="form-control" name="senha" required
               minlength="8" placeholder="Mínimo 8 caracteres">
      </div>
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-person-plus"></i> Criar Usuário
      </button>
    </form>
  </div>
</div>
{% endblock %}
